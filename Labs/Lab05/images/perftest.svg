<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>

  <!-- PerfTest -->
  <rect x="20" y="20" width="720" height="130" rx="10" fill="#f4f7fb" stroke="#5b7fa6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="42" font-size="14" font-weight="bold" fill="#2f4f73">PerfTest (container Docker)</text>

  <rect x="50" y="60" width="170" height="70" rx="8" fill="#dbe8f6" stroke="#2f4f73"/>
  <text x="135" y="88" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2b3a">Produtor</text>
  <text x="135" y="110" font-size="11" text-anchor="middle" font-family="Menlo, monospace" fill="#333">--rate R</text>

  <rect x="265" y="60" width="230" height="70" rx="8" fill="#ffffff" stroke="#999"/>
  <text x="380" y="84" font-size="12" text-anchor="middle" fill="#555">a cada segundo mostra:</text>
  <text x="380" y="108" font-size="12" text-anchor="middle" font-family="Menlo, monospace" fill="#1d2b3a">sent · received · latência</text>

  <rect x="550" y="52" width="170" height="70" rx="8" fill="#dff1e1" stroke="#2e6b3a"/>
  <rect x="545" y="56" width="170" height="70" rx="8" fill="#dff1e1" stroke="#2e6b3a"/>
  <rect x="540" y="60" width="170" height="70" rx="8" fill="#dff1e1" stroke="#2e6b3a"/>
  <text x="625" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2b3a">Consumidor × N</text>
  <text x="625" y="110" font-size="11" text-anchor="middle" font-family="Menlo, monospace" fill="#333">--consumer-rate C</text>

  <!-- Broker -->
  <rect x="200" y="190" width="360" height="130" rx="10" fill="#fff4e8" stroke="#c2701f" stroke-width="1.5"/>
  <text x="216" y="212" font-size="14" font-weight="bold" fill="#8a4a0e">RabbitMQ (broker)</text>

  <text x="380" y="236" font-size="12" text-anchor="middle" font-family="Menlo, monospace" fill="#8a4a0e">fila perf.q</text>
  <rect x="260" y="244" width="240" height="46" rx="6" fill="#ffffff" stroke="#c2701f"/>
  <g fill="#f6c58f" stroke="#c2701f">
    <rect x="270" y="252" width="30" height="30" rx="3"/>
    <rect x="308" y="252" width="30" height="30" rx="3"/>
    <rect x="346" y="252" width="30" height="30" rx="3"/>
    <rect x="384" y="252" width="30" height="30" rx="3"/>
    <rect x="422" y="252" width="30" height="30" rx="3"/>
    <rect x="460" y="252" width="30" height="30" rx="3"/>
  </g>
  <text x="380" y="308" font-size="11" text-anchor="middle" fill="#8a4a0e">cada mensagem leva o instante de publicação t_pub</text>

  <!-- Arrows -->
  <path d="M135 130 V267 H256" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="125" y="200" font-size="12" text-anchor="end" fill="#333">publica</text>
  <text x="125" y="216" font-size="12" font-weight="bold" text-anchor="end" fill="#333">R msg/s</text>

  <path d="M500 267 H625 V134" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="635" y="200" font-size="12" fill="#333">consome</text>
  <text x="635" y="216" font-size="12" font-weight="bold" fill="#333">C msg/s (cada)</text>
  <text x="575" y="300" font-size="11" fill="#2e6b3a">latência = agora − t_pub</text>
</svg>
