syntax= "proto3";
option java_multiple_files = true;
option java_package = "coderunner.contract.registry";

package registry;

service ManagerRegistry {
  // registo do RunServer + recebe endereço do REDIS
  rpc registerRunServer(RegisterRequest) returns (RegisterReply);
}

message RegisterRequest {
  string ip = 1;
  int32  port = 2;
}

message RegisterReply {
  string redisIp = 1;
  int32 redisPort = 2;
}